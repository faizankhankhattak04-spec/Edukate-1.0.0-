name: Finalize canonical URLs

on:
  push:
    branches:
      - seo/speako-development

permissions:
  contents: write

jobs:
  canonicalize:
    if: ${{ !contains(github.event.head_commit.message, 'SEO: finalize canonical URLs') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4

      - name: Add absolute self-referencing canonicals
        shell: python
        run: |
          from pathlib import Path
          import re

          pages = [
              'index.html',
              'about.html',
              'course.html',
              'course-everyday.html',
              'course-speaking.html',
              'course-beginners.html',
              'course-business.html',
              'course-ielts.html',
              'course-kids.html',
              'team.html',
              'teachers/shah.html',
              'teachers/nomi.html',
              'teachers/faizan.html',
              'teachers/umer.html',
              'teachers/sakib.html',
              'teachers/dua.html',
              'pricing.html',
              'faq.html',
              'contact.html',
              'zh.html',
          ]

          canonical_re = re.compile(
              r'<link\\s+rel=["\']canonical["\']\\s+href=["\'][^"\']+["\']\\s*/?>',
              re.IGNORECASE,
          )

          for page in pages:
              path = Path(page)
              if not path.exists():
                  raise SystemExit(f'Missing expected page: {page}')

              url = 'https://speako.cc/' if page == 'index.html' else f'https://speako.cc/{page}'
              text = path.read_text(encoding='utf-8')
              tag = f'<link rel="canonical" href="{url}">'

              if canonical_re.search(text):
                  text = canonical_re.sub(tag, text, count=1)
              else:
                  marker = re.search(r'<meta\\s+name=["\']robots["\'][^>]*>', text, re.IGNORECASE)
                  if not marker:
                      raise SystemExit(f'No robots meta tag found in {page}; refusing blind insertion')
                  pos = marker.end()
                  text = text[:pos] + '\n' + tag + text[pos:]

              path.write_text(text, encoding='utf-8')
              print(f'{page} -> {url}')

      - name: Commit canonical changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html about.html course.html course-everyday.html course-speaking.html course-beginners.html course-business.html course-ielts.html course-kids.html team.html teachers/shah.html teachers/nomi.html teachers/faizan.html teachers/umer.html teachers/sakib.html teachers/dua.html pricing.html faq.html contact.html zh.html
          if git diff --cached --quiet; then
            echo "No canonical changes needed."
            exit 0
          fi
          git commit -m "SEO: finalize canonical URLs"
          git push origin HEAD:seo/speako-development
